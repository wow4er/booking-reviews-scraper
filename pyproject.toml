[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-reviews-scraper"
version = "1.0.0"
description = "Scrapes hotel reviews from booking.com by talking to its internal GraphQL API"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.16.0",
    "beautifulsoup4>=4.12",
    "lxml>=6.0.2",
    "cryptography>=46.0.3",
    "pyscrypt>=1.6.2",
]

[project.scripts]
booking-reviews-scraper = "booking_reviews_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["booking_reviews_scraper*"]
